<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YTMusic Awaker</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #121212;
      color: #ffffff;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    h1 {
      font-size: 15px;
      margin: 0;
      font-weight: 600;
    }
    p {
      font-size: 12px;
      line-height: 1.4;
      color: #aaaaaa;
      margin: 0 0 12px 0;
    }
    .badge {
      display: inline-block;
      padding: 4px 8px;
      background: #272727;
      border-radius: 4px;
      font-size: 11px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="status-dot"></div>
    <h1>YTMusic Awaker</h1>
  </div>
  <p>Protection active: YouTube Music tab is kept awake, preventing render eviction and blank screen delays.</p>
  <div class="badge">Overhead: ~5-15 MB RAM</div>
</body>
</html>
